name: Android build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NanasDrama-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      NANASDRAMA_KEYSTORE_BASE64: ${{ secrets.NANASDRAMA_KEYSTORE_BASE64 }}
      NANASDRAMA_KEYSTORE_PASSWORD: ${{ secrets.NANASDRAMA_KEYSTORE_PASSWORD }}
      NANASDRAMA_KEY_ALIAS: ${{ secrets.NANASDRAMA_KEY_ALIAS }}
      NANASDRAMA_KEY_PASSWORD: ${{ secrets.NANASDRAMA_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Prepare signing key
        run: |
          test -n "$NANASDRAMA_KEYSTORE_BASE64"
          test -n "$NANASDRAMA_KEYSTORE_PASSWORD"
          test -n "$NANASDRAMA_KEY_ALIAS"
          test -n "$NANASDRAMA_KEY_PASSWORD"
          echo "$NANASDRAMA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nanasdrama-release.jks"
      - name: Build signed release APK
        env:
          NANASDRAMA_KEYSTORE_PATH: ${{ runner.temp }}/nanasdrama-release.jks
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: NanasDrama-release-${{ github.ref_name }}
          path: app/build/outputs/apk/release/app-release.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
